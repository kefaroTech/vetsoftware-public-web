name: Publish SemVer release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer already merged into main (X.Y.Z)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: public-frontend-publish-release-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and publish release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      CI: true
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
      ECR_REPOSITORY: vetsoftware-public-front
      RELEASE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
      VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}
      RELEASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || format('release/{0}', inputs.version) }}

    steps:
      - name: Check out merged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Enforce production-only ECR publication
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual ECR publication is allowed only from main." >&2
            exit 1
          fi

          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]] || {
            echo "The checked-out production commit does not match the release event." >&2
            exit 1
          }

          echo "Production artifact policy confirmed; development never publishes or retains a separate ECR image."

      - name: Validate release version
        id: release
        shell: bash
        run: |
          if [[ ! "$RELEASE_BRANCH" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The version must match strict SemVer X.Y.Z." >&2
            exit 1
          fi
          echo "version=${RELEASE_BRANCH#release/}" >> "$GITHUB_OUTPUT"

      # Va aquí arriba, y no junto a los pasos de AWS que la consumen, a propósito.
      # Los dos valores salen del bloque `env:` del job (`vars.*` del environment
      # `production`), así que no dependen de nada que produzcan los pasos de abajo:
      # se pueden comprobar en segundos. Cuando estaba después de `Build release`, un
      # environment sin configurar se descubría tras `npm ci` + audit + quality gate +
      # cobertura + build — varios minutos de runner quemados para acabar fallando por
      # una variable vacía. Peor todavía en el caso de VITE_RECAPTCHA_SITE_KEY, porque
      # esa variable la consume el propio build de la imagen.
      - name: Validate AWS publication configuration
        shell: bash
        run: |
          [[ -n "$AWS_ROLE_TO_ASSUME" && -n "$VITE_RECAPTCHA_SITE_KEY" ]] || {
            echo "Configure AWS_ECR_PUBLISH_ROLE_ARN and VITE_RECAPTCHA_SITE_KEY in the production environment." >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Verify synchronized release metadata
        run: node .github/scripts/release-version.mjs verify "${{ steps.release.outputs.version }}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: node .github/scripts/audit-dependencies.mjs

      - name: Run global quality gate
        run: npm run quality

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build release
        run: npm run build

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check release image idempotency
        id: image
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          sha_tag="sha-${RELEASE_COMMIT::12}"
          version_digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$version" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          sha_digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$sha_tag" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"

          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"
          if [[ -z "$version_digest" && -z "$sha_digest" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$version_digest" && "$version_digest" == "$sha_digest" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "The immutable release image already exists with matching version and commit tags."
          else
            echo "ECR contains a partial or conflicting immutable release image." >&2
            exit 1
          fi

      # Sin condicion, a diferencia de los pasos de build: cuando la imagen ya
      # existe (`push == false`, re-ejecucion del workflow) hay que poder leer
      # de todas formas su SBOM y su procedencia del registro para adjuntarlos a
      # la release. Iniciar sesion es idempotente y no publica nada.
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up QEMU
        if: steps.image.outputs.push == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.image.outputs.push == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and publish immutable multi-architecture image
        if: steps.image.outputs.push == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_RECAPTCHA_SITE_KEY=${{ env.VITE_RECAPTCHA_SITE_KEY }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.release.outputs.version }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=public-front
          cache-to: type=gha,mode=max,scope=public-front

      # BE-27 / TR-04: «SBOM producido y tirado». `provenance: mode=max` y
      # `sbom: true` ya generaban las dos atestaciones y buildx las empujaba
      # adjuntas a la imagen, donde solo son legibles con credenciales de ECR y
      # nadie las miraba jamas. Aqui se bajan a fichero para que sobrevivan al
      # runner: artefacto del workflow y, mas abajo, activo de la release.
      #
      # Son imagenes multiplataforma, asi que cada fichero es un objeto indexado
      # por plataforma (`linux/amd64`, `linux/arm64`).
      #
      # ALCANCE, para que nadie lea de mas en este fichero: el escaner de SBOM
      # de BuildKit inventaria la etapa FINAL de la imagen, y la etapa final de
      # este `Dockerfile` es nginx sobre Alpine mas `/usr/share/nginx/html`. El
      # arbol npm vive en la etapa `build`, que no se escanea, y `dist` es
      # JavaScript empaquetado sin metadatos de paquete. Es decir: este SBOM
      # cubre los paquetes de Alpine y nginx, NO axios, vue ni vuetify. Para
      # esas hace falta `ARG BUILDKIT_SBOM_SCAN_STAGE=true` en la etapa `build`
      # del Dockerfile; seguimiento en el issue del repositorio.
      - name: Retain the SBOM and the provenance of the release image
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          image="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$version"

          mkdir -p release-attestations
          sbom="release-attestations/sbom.json"
          provenance="release-attestations/provenance.json"

          docker buildx imagetools inspect "$image" --format '{{ json .SBOM }}' > "$sbom"
          docker buildx imagetools inspect "$image" --format '{{ json .Provenance }}' > "$provenance"

          # Un fichero vacio o `null` significa que la imagen se publico sin
          # atestacion. Retener un fichero vacio seria repetir el defecto con
          # mas pasos, asi que esto es una puerta y no un aviso.
          for fichero in "$sbom" "$provenance"; do
            if [[ ! -s "$fichero" ]] || ! jq -e 'select(. != null and . != {})' "$fichero" >/dev/null; then
              echo "$fichero no contiene atestacion: revisa provenance/sbom en el build de la imagen." >&2
              exit 1
            fi
            echo "$fichero -> $(wc -c < "$fichero") bytes"
          done

      - name: Upload the SBOM and the provenance as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestations-${{ steps.release.outputs.version }}
          path: release-attestations/
          if-no-files-found: error
          retention-days: 90

      # TR-04. La imagen llegaba a ECR, ECR la escaneaba al subirla y la
      # release se publicaba sin que nadie leyera el resultado: una imagen con
      # criticas se etiquetaba en verde igual que una limpia. Este paso lee ese
      # veredicto, que ya estaba calculado y guardado, y corta la publicacion.
      #
      # NO es el bloque del backend copiado tal cual, y la diferencia es la
      # razon de que no lo sea. El backend publica UNA sola plataforma y
      # desactiva `provenance`/`sbom` a proposito (ver el comentario de su paso
      # de build), asi que su tag apunta a un manifiesto de plataforma y le
      # basta con esperar sobre el digest del tag. Aqui el tag apunta a un
      # INDICE OCI -- amd64 y arm64, mas las dos atestaciones -- y el escaneo
      # basico de ECR no escanea indices, solo manifiestos de plataforma.
      # Esperar sobre el digest del indice se habria colgado hasta agotar el
      # waiter y habria bloqueado todas las releases: es el mismo bloqueo que
      # el backend ya sufrio en el despliegue de desarrollo. Por eso aqui se
      # bajan los hijos del indice y se exige veredicto de cada uno.
      #
      # Va despues de subir el SBOM como artefacto y antes del tag: si el gate
      # rechaza, el SBOM sigue disponible para averiguar que trae el CVE, pero
      # no existe ni la etiqueta inmutable ni la GitHub Release.
      #
      # Sin `if:` a proposito, y no por rescaneo: el escaneo del registro es
      # BASIC (VetSoftwareIaC/modules/ecr/main.tf:50-61), que escanea una sola
      # vez al subir la imagen y no reevalua lo ya almacenado -- eso es cosa
      # del escaneo ENHANCED. El motivo es otro: en una re-ejecucion sobre una
      # imagen que ya existia no se reconstruye nada, y sin este paso esa
      # segunda pasada crearia el tag y la Release saltandose el veredicto que
      # la primera nunca llego a consultar.
      #
      # RIESGO RESIDUAL ACEPTADO: cuando este gate rechaza, la imagen ya esta
      # en ECR con sus dos etiquetas inmutables -- el escaneo basico solo
      # existe despues del push, asi que no hay forma de mirarlo antes. Lo que
      # se evita aqui es que esa imagen se anuncie como release. Cortarlo antes
      # del push exige escanear en local (Trivy/Grype), y hoy eso sigue
      # bloqueado por la allowlist de actions (vetsoftware-infrastructure#109).
      - name: Enforce the ECR vulnerability scan gate
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"

          index_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$version" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::ECR no devolvio un digest valido para ${ECR_REPOSITORY}:${version}." >&2
            exit 1
          }

          # Las atestaciones de buildx viajan dentro del indice como entradas
          # con `platform.architecture == "unknown"`. No son imagenes, ECR no
          # las escana y se descartan aqui a proposito: esperar un escaneo que
          # nunca va a existir es exactamente como se cuelga este gate.
          # Sin `|| true`: un fallo de esta llamada NO puede confundirse con
          # «no es un indice». Si se silenciara, un throttling o un corte de
          # red haria creer que la imagen es de una sola plataforma, el gate
          # esperaria sobre el digest del indice -- que ECR nunca escanea -- y
          # agotaria el waiter bloqueando una release limpia.
          if ! manifest="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageDigest=$index_digest" \
            --accepted-media-types \
              "application/vnd.oci.image.index.v1+json" \
              "application/vnd.docker.distribution.manifest.list.v2+json" \
            --query 'images[0].imageManifest' \
            --output text)"; then
            echo "::error::No se pudo leer el manifiesto de $index_digest en ECR. Sin el no se sabe que hay que escanear, y este paso no publica a ciegas." >&2
            exit 1
          fi

          if [[ -z "$manifest" || "$manifest" == "None" ]]; then
            # Respuesta valida que no es un indice: la imagen es de una sola
            # plataforma y sin atestaciones (como la del backend), asi que el
            # digest del tag ya ES el manifiesto que hay que escanear.
            platform_digests="$index_digest"
          else
            platform_digests="$(jq -r '
              (.manifests // [])
              | map(select((.platform.architecture // "unknown") != "unknown"))
              | .[].digest
            ' <<<"$manifest")"

            # Es un indice, pero no declara ninguna plataforma: solo podrian
            # ser atestaciones. Aqui no se cae al digest del indice, que es la
            # via rapida para colgar el waiter cinco minutos; se corta.
            [[ -n "$platform_digests" ]] || {
              echo "::error::El indice $index_digest no declara ningun manifiesto de plataforma escaneable." >&2
              exit 1
            }
          fi

          echo "Indice: $index_digest"
          echo "Manifiestos de plataforma a verificar:"
          sed 's/^/  - /' <<<"$platform_digests"

          rechazados=0
          while read -r digest; do
            [[ -n "$digest" ]] || continue

            # El waiter sondea hasta 60 veces cada 5 s. Se envuelve para poder
            # decir cual de los dos fallos es, porque tienen arreglos
            # distintos: "sigue escaneando" se reintenta, "aqui no hay escaneo
            # ninguno" es que la configuracion del registro dejo de aplicar.
            if ! aws ecr wait image-scan-complete \
              --repository-name "$ECR_REPOSITORY" \
              --image-id "imageDigest=$digest"; then
              echo "::error::El escaneo de $digest no llego a COMPLETE. Si ECR nunca lo empezo, comprobar que la configuracion de escaneo del registro sigue en pie (VetSoftwareIaC/modules/ecr/main.tf)." >&2
              exit 1
            fi

            findings="$(aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id "imageDigest=$digest" \
              --query '{status: imageScanStatus.status, counts: imageScanFindings.findingSeverityCounts}' \
              --output json)"

            scan_status="$(jq -r '.status // "UNKNOWN"' <<<"$findings")"
            critical="$(jq -r '.counts.CRITICAL // 0' <<<"$findings")"
            high="$(jq -r '.counts.HIGH // 0' <<<"$findings")"

            if [[ "$scan_status" != "COMPLETE" ]]; then
              echo "::error::El escaneo de $digest quedo en estado $scan_status. No se publica una release sin veredicto." >&2
              exit 1
            fi

            echo "$digest -> status=$scan_status critical=$critical high=$high"

            if [[ "$critical" != "0" || "$high" != "0" ]]; then
              echo "::error::$digest trae $critical criticas y $high altas. Revisar los hallazgos en ECR y actualizar la imagen base antes de reintentar la release." >&2
              rechazados=$((rechazados + 1))
            fi
          done <<<"$platform_digests"

          [[ "$rechazados" -eq 0 ]] || exit 1

          echo "Escaneo de ECR superado en todos los manifiestos de plataforma."

      - name: Create immutable version tag
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            [[ "$(git rev-list -n 1 "$tag")" == "$(git rev-parse HEAD)" ]] || {
              echo "$tag already points to a different commit." >&2
              exit 1
            }
          else
            git tag --annotate "$tag" --message "VetSoftware Public Front $version"
            git push origin "refs/tags/$tag"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.release.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --verify-tag \
            --generate-notes \
            --title "VetSoftware Public Front ${{ steps.release.outputs.version }}"

          # El artefacto del workflow caduca a los 90 dias; la release no. Es el
          # unico sitio donde el SBOM sigue estando el dia que haya que
          # responder "esta version que lleva un ano en produccion, incluye el
          # paquete del CVE de esta manana?".
          # `--clobber` para que una re-ejecucion reemplace en vez de fallar.
          gh release upload "$tag" release-attestations/* --clobber
