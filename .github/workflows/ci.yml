name: Public frontend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality-gate:
    name: Frontend quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run global quality gate
        run: npm run quality

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # El build no falla nunca por tamaño: Vite avisa por consola y sigue. Este
      # paso es lo que convierte ese aviso en una puerta.
      - name: Enforce bundle budget
        run: npm run budget

  e2e-smoke:
    name: Playwright smoke test
    needs: frontend-quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authentication smoke tests
        run: >-
          npx playwright test e2e/auth.spec.ts --project=chromium
          --grep "dashboard sin sesi.n redirige|otra sesi.n reemplaz."

  container-image:
    name: Build production container image
    needs: e2e-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build production image ephemerally (no ECR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: vetsoftware/public-front:ci
          cache-from: type=gha,scope=public-front
          cache-to: type=gha,mode=max,scope=public-front
