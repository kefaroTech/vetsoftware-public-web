name: Public frontend CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality-gate:
    name: Frontend quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run global quality gate
        run: npm run quality

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # El build no falla nunca por tamaño: Vite avisa por consola y sigue. Este
      # paso es lo que convierte ese aviso en una puerta.
      - name: Enforce bundle budget
        run: npm run budget

  visual-regression:
    name: Visual regression
    needs: frontend-quality-gate
    runs-on: ubuntu-24.04
    # Corre DENTRO de la imagen oficial de Playwright, no en el runner pelado, y
    # esa es la condicion que hace util a esta suite: las lineas base se generan
    # con esta misma imagen (`npm run visual:docker:update`), asi que el
    # antialiasing y las metricas de fuente son identicos. Sobre el runner
    # desnudo bastaria un cambio de fuentes del sistema para dejar la suite en
    # rojo sin que nadie haya tocado una linea de CSS.
    #
    # Aqui solo se compara la galeria visual. Los E2E de flujo (`e2e/**`,
    # `playwright.config.ts`) NO corren en CI por decision del proyecto: se
    # ejecutan a mano en local. No los reintroduzcas en este job.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # La galeria se sirve con `npm run dev`, que es `vite --mode localdev`, y
      # `vite.config.ts` aborta si no encuentra un fichero de entorno cuyo
      # `VETSOFTWARE_PROFILE` case con el modo. Ese fichero es `.env.local`, que
      # esta en `.gitignore` --lleva la URL del backend de cada quien-- asi que
      # el runner nunca lo tuvo y el servidor moria antes de servir nada.
      #
      # El ejemplo versionado basta: la galeria no llama al backend, solo pinta
      # primitivas de CSS.
      - name: Provide the localdev environment file
        run: cp .env.local.example .env.local

      # Si no hay lineas base --repositorio recien clonado, o alguien anadio un
      # bloque nuevo a la galeria-- las genera y FALLA a proposito, dejandolas en
      # el artefacto. Generarlas y pasar en silencio seria peor: nadie las
      # commitearia y la suite viviria para siempre sin nada contra que comparar.
      #
      # Esto es ademas la via recomendada para crearlas: se hacen aqui, con la
      # imagen del CI, sin que nadie tenga que bajarse 2 GB en su portatil.
      - name: Compare against the visual baseline
        run: |
          if [ -z "$(ls -A visual/__screenshots__ 2>/dev/null)" ]; then
            echo "::error::No hay lineas base. Se generan ahora y se suben como artefacto 'visual-baseline'; descargalo y commitea visual/__screenshots__."
            npx playwright test --config=playwright.visual.config.ts --update-snapshots
            exit 1
          fi
          npx playwright test --config=playwright.visual.config.ts

      # Sin esto, un fallo solo dice "las imagenes no coinciden". El artefacto
      # lleva el esperado, el obtenido y el diff resaltado, que es lo unico que
      # permite decidir en la revision si el cambio era el que se buscaba.
      - name: Upload the visual diff or the freshly generated baseline
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baseline
          path: |
            visual/__screenshots__/
            test-results/
            playwright-report-visual/
          retention-days: 7
