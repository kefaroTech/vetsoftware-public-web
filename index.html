<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumbre</title>
    <meta
      name="description"
      content="Lumbre es el software de gestión para clínicas veterinarias en Colombia: agenda, historia clínica, hospitalización, inventario y facturación DIAN, en módulos que enciendes y apagas."
    />
    <meta name="theme-color" content="#0F172A" />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16x16.png" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Absolutas y ancladas a `vetsoftware.co`, no a `app.vetsoftware.co`: el
         mismo artefacto se sirve bajo los dos nombres, pero la superficie que se
         comparte es la portada comercial, y los rastreadores descartan una ruta
         relativa en vez de resolverla contra el documento. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vetsoftware.co/" />
    <meta property="og:site_name" content="Lumbre" />
    <meta property="og:title" content="Lumbre — Gestiona lo que cuidas" />
    <meta
      property="og:description"
      content="Agenda, historia clínica, hospitalización, inventario y facturación DIAN para clínicas veterinarias en Colombia. Paga solo los módulos que uses."
    />
    <meta property="og:image" content="https://vetsoftware.co/brand/open-graph-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lumbre — Gestiona lo que cuidas" />
    <meta property="og:locale" content="es_CO" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumbre — Gestiona lo que cuidas" />
    <meta
      name="twitter:description"
      content="Agenda, historia clínica, hospitalización, inventario y facturación DIAN para clínicas veterinarias en Colombia. Paga solo los módulos que uses."
    />
    <meta name="twitter:image" content="https://vetsoftware.co/brand/twitter-x-1200x600.png" />
    <meta name="twitter:image:alt" content="Lumbre — Gestiona lo que cuidas" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
