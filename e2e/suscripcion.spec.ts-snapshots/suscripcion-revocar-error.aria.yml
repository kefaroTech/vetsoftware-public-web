- alertdialog "Revocar medio de pago":
  - banner:
    - heading "Revocar medio de pago" [level=2]
    - paragraph: Visa
    - button "Cerrar"
  - alert:
    - paragraph: Hay 1 problema en este formulario
    - list:
      - listitem:
        - link "Escribe por qué revocas este medio de pago.":
          - /url: /#v-\d+/
  - paragraph: /Es tu único medio de pago activo\. Si lo revocas, el cobro del 1 sep \d+ no se podrá hacer y tu plan pasará a pago pendiente\./
  - text: Motivo (obligatorio)
  - textbox "Motivo (obligatorio)" [invalid]:
    - /placeholder: "Por ejemplo: cambiamos de tarjeta corporativa."
  - paragraph: "Error: Escribe por qué revocas este medio de pago."
  - contentinfo:
    - button "Cancelar"
    - button "Revocar medio de pago"