- region "Planes":
  - heading "Planes" [level=2]
  - paragraph: Elige por el tamaño de tu clínica, no por una lista de funciones.
  - group "Cómo prefieres pagar":
    - text: ""
    - radio "Mes a mes" [checked]
    - text: Mes a mes
