- main:
  - heading "Confirma tu plan" [level=1]
  - paragraph:
    - text: Estás contratando para
    - strong: Clínica E2E de prueba
    - text: /\(NIT \d+-7\)\./
  - table "Lo que vas a contratar, con un enlace para cambiar cada dato":
    - caption: Lo que vas a contratar, con un enlace para cambiar cada dato
    - rowgroup:
      - row "Plan Clínica Cambiar el plan":
        - rowheader "Plan"
        - cell "Clínica"
        - cell "Cambiar el plan":
          - link "Cambiar el plan":
            - /url: /planes?plan=CLINICA&ciclo=MENSUAL&sedes=1&usuarios=1
      - row "Ciclo de pago Mes a mes Cambiar el ciclo de pago":
        - rowheader "Ciclo de pago"
        - cell "Mes a mes"
        - cell "Cambiar el ciclo de pago":
          - link "Cambiar el ciclo de pago":
            - /url: /planes?plan=CLINICA&ciclo=MENSUAL&sedes=1&usuarios=1
      - row "Sedes 1 Cambiar el número de sedes":
        - rowheader "Sedes"
        - cell "1"
        - cell "Cambiar el número de sedes":
          - link "Cambiar el número de sedes":
            - /url: /planes?plan=CLINICA&ciclo=MENSUAL&sedes=1&usuarios=1
      - row "Personas 1 Cambiar el número de personas":
        - rowheader "Personas"
        - cell "1"
        - cell "Cambiar el número de personas":
          - link "Cambiar el número de personas":
            - /url: /planes?plan=CLINICA&ciclo=MENSUAL&sedes=1&usuarios=1
  - table "Importes":
    - caption: Importes
    - rowgroup:
      - row /Subtotal \$ \d+\.\d+/:
        - rowheader "Subtotal"
        - cell /\$ \d+\.\d+/
      - row /IVA \(\d+ %\) \$ \d+\.\d+/:
        - rowheader /IVA \(\d+ %\)/
        - cell /\$ \d+\.\d+/
      - row /Total del primer mes \$ \d+\.\d+/:
        - rowheader "Total del primer mes"
        - cell /\$ \d+\.\d+/
  - paragraph:
    - text: Cada módulo tiene su propia prueba, y no terminan todas el mismo día.
    - strong: "Caja termina antes:"
    - text: /el \d+ de septiembre, \d+ empezamos a cobrar Caja, y Inventario sigue gratis hasta el \d+ de septiembre, \d+\./
  - table "Fecha de fin de la prueba de cada módulo, de la que termina antes a la que termina después":
    - caption: Fecha de fin de la prueba de cada módulo, de la que termina antes a la que termina después
    - rowgroup:
      - row "Módulo Gratis hasta Después":
        - columnheader "Módulo"
        - columnheader "Gratis hasta"
        - columnheader "Después"
    - rowgroup:
      - row /Caja \d+ de septiembre, \d+ Incluido en tu plan/:
        - cell "Caja"
        - cell /\d+ de septiembre, \d+/
        - cell "Incluido en tu plan"
      - row /Agenda \d+ de septiembre, \d+ Incluido en tu plan/:
        - cell "Agenda"
        - cell /\d+ de septiembre, \d+/
        - cell "Incluido en tu plan"
      - row /Historia clínica \d+ de septiembre, \d+ Incluido en tu plan/:
        - cell "Historia clínica"
        - cell /\d+ de septiembre, \d+/
        - cell "Incluido en tu plan"
      - row /Hospitalización \d+ de septiembre, \d+ Incluido en tu plan/:
        - cell "Hospitalización"
        - cell /\d+ de septiembre, \d+/
        - cell "Incluido en tu plan"
      - row /Inventario \d+ de septiembre, \d+ Incluido en tu plan/:
        - cell "Inventario"
        - cell /\d+ de septiembre, \d+/
        - cell "Incluido en tu plan"
  - 'complementary "Modo demostración: no vamos a cobrarte nada"':
    - 'heading "Modo demostración: no vamos a cobrarte nada" [level=3]'
    - paragraph: Todavía no tenemos conectada la pasarela de pago. Al confirmar, tu plan se activa y empieza tu periodo de prueba.
    - paragraph: No se te va a cobrar, no vamos a pedirte una tarjeta y no guardamos ningún dato de pago. Cuando conectemos la pasarela te escribiremos por correo antes del primer cobro, y podrás decidir entonces.
  - checkbox "He leído y acepto los Términos del servicio y la Política de tratamiento de datos."
  - text: He leído y acepto los
  - strong: Términos del servicio
  - text: y la
  - strong: Política de tratamiento de datos
  - text: .
  - paragraph:
    - text: "Todavía no están publicadas en la web: pídenoslas en"
    - link "soporte@vetsoftware.co":
      - /url: mailto:soporte@vetsoftware.co
    - text: y te las enviamos antes de que confirmes.
  - paragraph:
    - text: Durante la prueba no se cobra nada. Si quieres darte de baja antes de que empiece el cobro, escríbenos a
    - link "soporte@vetsoftware.co":
      - /url: mailto:soporte@vetsoftware.co
    - text: y lo hacemos.
  - button "Confirmar y activar mi plan"
  - button "Ahora no"