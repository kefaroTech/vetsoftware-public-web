<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VetSoftware · Registro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; font-family:'Inter',sans-serif; color:#1a1325; background:#f5f1fa; -webkit-font-smoothing:antialiased; }
  input, button, select { font-family: inherit; }
  input:focus, select:focus, button:focus { outline: none; }
  #root { width:100vw; height:100vh; overflow:hidden; }
  a { color:#7e22ce; }
  a:hover { color:#6b1fa8; }
  /* Grids responsivos: 2 y 3 columnas en escritorio, apilados en móvil (≤720px) */
  .reg-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
  .reg-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:15px; }
  @media (max-width:720px) {
    .reg-grid-2, .reg-grid-3 { grid-template-columns:1fr; }
  }
  @keyframes regspin { to { transform: rotate(360deg); } }
  .reg-spin { animation: regspin .7s linear infinite; }
  @keyframes reveal { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
  .reveal { animation: reveal .5s cubic-bezier(.2,.8,.2,1) both; }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } .reg-spin { animation-duration: 1.4s; } }
  /* Scrollbar suave dentro del formulario */
  .reg-scroll::-webkit-scrollbar { width:8px; }
  .reg-scroll::-webkit-scrollbar-thumb { background:#e0d3f0; border-radius:4px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="reg-fields.jsx"></script>
<script type="text/babel" src="reg-form.jsx"></script>
<script type="text/babel" src="reg-flow.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<RegistroFlow />);
</script>
</body>
</html>
