<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VetSoftware · Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; font-family:'Inter',sans-serif; color:#1a1325; background:#f5f1fa; -webkit-font-smoothing:antialiased; }
  input, button { font-family: inherit; }
  #root { width:100vw; height:100vh; overflow:hidden; }
  a { color:#7e22ce; }
  a:hover { color:#6b1fa8; }
  @keyframes drift {
    0%   { transform: translate(0,0) scale(1); }
    33%  { transform: translate(30px,-24px) scale(1.06); }
    66%  { transform: translate(-24px,20px) scale(.96); }
    100% { transform: translate(0,0) scale(1); }
  }
  .blob { position:absolute; border-radius:50%; pointer-events:none; filter:blur(8px); animation: drift 18s ease-in-out infinite; }
  @keyframes reveal { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
  .reveal { opacity:0; animation: reveal .7s cubic-bezier(.2,.8,.2,1) forwards; }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .reveal { opacity:1; animation: none; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="landing.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<Landing />);
</script>
</body>
</html>
